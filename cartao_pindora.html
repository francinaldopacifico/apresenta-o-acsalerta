<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Apresentação - Pindora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .cartao {
            display: flex;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cartao:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .cartao-imagem {
            flex: 2;
            background-color: #e5f5eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cartao-imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cartao-conteudo {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border-left: 1px solid #f3f4f6;
        }

        .texto-chamada {
            font-size: 20px;
            color: #374151;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .link-pindora {
            display: inline-block;
            background-color: #10b981; /* Verde Pindora */
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 18px;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }

        .link-pindora:hover {
            background-color: #059669;
            transform: scale(1.02);
        }
        
        .link-pindora:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .cartao {
                flex-direction: column;
            }
            .cartao-imagem {
                height: 250px;
            }
            .cartao-conteudo {
                padding: 30px 20px;
                text-align: center;
                border-left: none;
                border-top: 1px solid #f3f4f6;
            }
        }
    </style>
</head>
<body>

    <div class="cartao">
        <div class="cartao-imagem">
            <!-- Substitua 'imagem_site.jpg' pelo nome exato do arquivo da foto que você me enviou -->
            <img src="imagem_site.jpg" alt="Plataforma Pindora.online">
        </div>
        <div class="cartao-conteudo">
            <p class="texto-chamada">
                Bem-vindo ao futuro do cuidado comunitário. Acesse:
            </p>
            <a href="https://pindora.online" class="link-pindora" target="_blank" rel="noopener noreferrer">
                pindora.online
            </a>
        </div>
    </div>

</body>
</html>
