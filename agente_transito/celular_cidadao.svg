<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 760" width="400" height="760">
  <defs>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="400" height="760" fill="#ffffff"/>

  <!-- Sombra do celular -->
  <ellipse cx="200" cy="730" rx="150" ry="10" fill="#000" opacity="0.18"/>

  <!-- Celular -->
  <g filter="url(#phoneShadow)">
    <rect x="40" y="30" width="320" height="700" rx="38" fill="url(#phoneBody)"/>
    <!-- Bezel interno -->
    <rect x="50" y="40" width="300" height="680" rx="32" fill="#0d1418"/>
  </g>

  <!-- Tela -->
  <rect x="58" y="48" width="284" height="664" rx="22" fill="#F0F4F8"/>

  <!-- Notch -->
  <path d="M140 48 Q140 36 160 36 L240 36 Q260 36 260 48 L260 60 L140 60 Z" fill="#0d1418"/>
  <ellipse cx="200" cy="48" rx="22" ry="6" fill="#000" opacity="0.5"/>
  <circle cx="232" cy="48" r="2" fill="#1a252f"/>

  <!-- Header -->
  <rect x="58" y="60" width="284" height="56" fill="url(#headerBlue)"/>
  <text x="78" y="98" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Portal do Cidadão</text>
  <circle cx="320" cy="88" r="12" fill="#fff" opacity="0.18"/>
  <text x="320" y="93" font-family="Roboto, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">⇽</text>

  <!-- Item: Consultar Débitos -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="140" width="244" height="68" rx="12" fill="#fff"/>
    <circle cx="113" cy="174" r="18" fill="none" stroke="#EF5350" stroke-width="2.5"/>
    <line x1="124" y1="185" x2="132" y2="193" stroke="#EF5350" stroke-width="2.5" stroke-linecap="round"/>
    <text x="148" y="170" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474F">Consultar Débitos e Multas</text>
    <text x="148" y="188" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#9E9E9E">Veja infrações pendentes</text>
  </g>

  <!-- Item: Emitir Boleto -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="220" width="244" height="68" rx="12" fill="#fff"/>
    <g transform="translate(96 240)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="none" stroke="#66BB6A" stroke-width="2.5"/>
      <rect x="4" y="4" width="6" height="6" fill="#66BB6A"/>
      <rect x="12" y="4" width="6" height="6" fill="#66BB6A"/>
      <rect x="20" y="4" width="6" height="6" fill="#66BB6A"/>
      <rect x="4" y="12" width="6" height="6" fill="#66BB6A"/>
      <rect x="20" y="12" width="6" height="6" fill="#66BB6A"/>
      <rect x="4" y="20" width="6" height="6" fill="#66BB6A"/>
      <rect x="12" y="20" width="6" height="6" fill="#66BB6A"/>
      <rect x="20" y="20" width="6" height="6" fill="#66BB6A"/>
      <rect x="4" y="28" width="22" height="2" fill="#66BB6A" opacity="0.4"/>
    </g>
    <text x="148" y="250" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474F">Emitir Boleto (PIX)</text>
    <text x="148" y="268" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#9E9E9E">Pagamento rápido</text>
  </g>

  <!-- Item: Indicar Condutor -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="300" width="244" height="68" rx="12" fill="#fff"/>
    <g transform="translate(96 320)">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#42A5F5" stroke-width="2"/>
      <path d="M0 18 Q6 14 12 18" fill="none" stroke="#42A5F5" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 10 L30 14 L22 18 L22 14 L18 14 L18 14 Z" stroke="#42A5F5" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </g>
    <text x="148" y="330" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474F">Indicar Real Condutor</text>
    <text x="148" y="348" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#9E9E9E">Transferir pontuação</text>
  </g>

  <!-- Item: Defesa / Recurso -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="380" width="244" height="68" rx="12" fill="#fff"/>
    <g transform="translate(94 396)">
      <path d="M0 14 L0 6 Q0 0 6 0 L22 0 Q28 0 28 6 L28 28 Q28 34 22 34 L8 34 L0 42 Z" fill="none" stroke="#FFA726" stroke-width="2" stroke-linejoin="round"/>
      <line x1="6" y1="10" x2="22" y2="10" stroke="#FFA726" stroke-width="1.8"/>
      <line x1="6" y1="16" x2="22" y2="16" stroke="#FFA726" stroke-width="1.8"/>
      <line x1="6" y1="22" x2="16" y2="22" stroke="#FFA726" stroke-width="1.8"/>
    </g>
    <text x="148" y="410" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474F">Defesa Prévia e Recurso</text>
    <text x="148" y="428" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#9E9E9E">JARI - Julgamento</text>
  </g>

  <!-- Item: Agendar Retirada -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="460" width="244" height="68" rx="12" fill="#fff"/>
    <g transform="translate(94 478)">
      <rect x="0" y="4" width="34" height="30" rx="2" fill="none" stroke="#AB47BC" stroke-width="2"/>
      <line x1="0" y1="12" x2="34" y2="12" stroke="#AB47BC" stroke-width="1.8"/>
      <line x1="8" y1="0" x2="8" y2="8" stroke="#AB47BC" stroke-width="2" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="26" y2="8" stroke="#AB47BC" stroke-width="2" stroke-linecap="round"/>
      <circle cx="17" cy="22" r="3" fill="#AB47BC"/>
    </g>
    <text x="148" y="490" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#37474F">Agendar Retirada</text>
    <text x="148" y="508" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#9E9E9E">Veículo do pátio</text>
  </g>

  <!-- Banner informativo -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="560" width="244" height="100" rx="12" fill="#fff"/>
    <rect x="86" y="568" width="6" height="84" rx="3" fill="#29B6F6"/>
    <text x="102" y="585" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#0288D1">Atendimento rápido</text>
    <text x="102" y="608" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161">Consulte débitos, pague multas</text>
    <text x="102" y="622" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161">e agende a retirada sem sair de</text>
    <text x="102" y="636" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161">casa. Disponível 24h.</text>
  </g>

  <!-- Navegação inferior -->
  <rect x="58" y="685" width="284" height="27" fill="#fff"/>
  <line x1="58" y1="685" x2="342" y2="685" stroke="#E0E0E0" stroke-width="0.8"/>
  <circle cx="200" cy="703" r="3" fill="#0288D1"/>
</svg>
