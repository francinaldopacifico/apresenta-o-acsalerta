<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="tabletBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="800" height="560" fill="#ffffff"/>

  <!-- Sombra do tablet -->
  <ellipse cx="400" cy="525" rx="320" ry="18" fill="#000" opacity="0.18"/>

  <!-- Corpo do tablet -->
  <rect x="50" y="40" width="700" height="480" rx="28" fill="url(#tabletBody)"/>

  <!-- Bezel interno -->
  <rect x="68" y="58" width="664" height="444" rx="14" fill="#0d1418"/>

  <!-- Tela -->
  <rect x="76" y="66" width="648" height="428" rx="6" fill="#F0F4F8"/>

  <!-- Camera -->
  <circle cx="400" cy="51" r="3" fill="#0a0d10"/>

  <!-- Header -->
  <rect x="76" y="66" width="648" height="60" fill="url(#headerBlue)"/>
  <text x="100" y="103" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">Agente de Trânsito</text>
  <circle cx="690" cy="96" r="14" fill="#fff" opacity="0.18"/>
  <text x="690" y="102" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">⇽</text>

  <!-- Card: Emitir AIT -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="155" width="195" height="100" rx="12" fill="#fff"/>
    <path d="M192 188 Q190 184 192 180 L196 180 L198 178 L202 178 L204 180 L208 180 Q210 184 208 188 L208 192 L204 194 L204 198 L198 198 L198 194 L194 192 Z" fill="#EF5350"/>
    <line x1="198" y1="204" x2="204" y2="204" stroke="#EF5350" stroke-width="2" stroke-linecap="round"/>
    <text x="198" y="234" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#EF5350" text-anchor="middle">Emitir AIT</text>
  </g>

  <!-- Card: Meus AITs -->
  <g filter="url(#dropShadow)">
    <rect x="302" y="155" width="195" height="100" rx="12" fill="#fff"/>
    <rect x="388" y="182" width="24" height="22" rx="2" fill="none" stroke="#D32F2F" stroke-width="2"/>
    <line x1="392" y1="190" x2="408" y2="190" stroke="#D32F2F" stroke-width="1.8"/>
    <line x1="392" y1="195" x2="404" y2="195" stroke="#D32F2F" stroke-width="1.8"/>
    <line x1="392" y1="200" x2="408" y2="200" stroke="#D32F2F" stroke-width="1.8"/>
    <text x="400" y="234" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#D32F2F" text-anchor="middle">Meus AITs</text>
  </g>

  <!-- Card: Consultar Placas -->
  <g filter="url(#dropShadow)">
    <rect x="504" y="155" width="195" height="100" rx="12" fill="#fff"/>
    <circle cx="602" cy="190" r="7" fill="none" stroke="#FFA726" stroke-width="2.5"/>
    <line x1="608" y1="196" x2="614" y2="202" stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
    <text x="602" y="234" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFA726" text-anchor="middle">Consultar Placas</text>
  </g>

  <!-- Card: Consultar Condutores -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="270" width="195" height="100" rx="12" fill="#fff"/>
    <circle cx="198" cy="300" r="5" fill="none" stroke="#29B6F6" stroke-width="2.5"/>
    <path d="M188 316 Q198 306 208 316" fill="none" stroke="#29B6F6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="198" y="349" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#29B6F6" text-anchor="middle">Condutores</text>
  </g>

  <!-- Card: Fiscalização Reboque -->
  <g filter="url(#dropShadow)">
    <rect x="302" y="270" width="195" height="100" rx="12" fill="#fff"/>
    <path d="M388 308 L388 302 L394 302 L394 296 L406 296 L406 302 L412 302 L412 308" fill="none" stroke="#AB47BC" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="391" cy="312" r="3" fill="none" stroke="#AB47BC" stroke-width="2"/>
    <circle cx="409" cy="312" r="3" fill="none" stroke="#AB47BC" stroke-width="2"/>
    <text x="400" y="349" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#AB47BC" text-anchor="middle">Fiscalização</text>
  </g>

  <!-- Card: Diário de Bordo -->
  <g filter="url(#dropShadow)">
    <rect x="504" y="270" width="195" height="100" rx="12" fill="#fff"/>
    <path d="M590 296 L610 296 L610 324 L590 324 Z" fill="none" stroke="#26A69A" stroke-width="2"/>
    <line x1="594" y1="302" x2="606" y2="302" stroke="#26A69A" stroke-width="1.5"/>
    <line x1="594" y1="308" x2="606" y2="308" stroke="#26A69A" stroke-width="1.5"/>
    <line x1="594" y1="314" x2="602" y2="314" stroke="#26A69A" stroke-width="1.5"/>
    <text x="602" y="349" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#26A69A" text-anchor="middle">Diário de Bordo</text>
  </g>

  <!-- Card: Sincronizar -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="385" width="195" height="100" rx="12" fill="#fff"/>
    <path d="M188 423 A6 6 0 1 1 200 423" fill="none" stroke="#66BB6A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M198 418 L200 423 L195 423" fill="#66BB6A"/>
    <path d="M210 408 A6 6 0 1 1 198 408" fill="none" stroke="#66BB6A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M200 413 L198 408 L203 408" fill="#66BB6A"/>
    <text x="198" y="464" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#66BB6A" text-anchor="middle">Sincronizar</text>
  </g>
</svg>
