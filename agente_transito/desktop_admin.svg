<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="bgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f5f7fa"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
    <linearGradient id="monitorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <linearGradient id="monitorBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29B6F6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="monitorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo branco -->
  <rect width="1000" height="680" fill="#ffffff"/>

  <!-- Sombra do monitor na mesa -->
  <ellipse cx="500" cy="600" rx="380" ry="14" fill="#000" opacity="0.15"/>

  <!-- Base do monitor (pé) -->
  <rect x="420" y="585" width="160" height="14" rx="4" fill="url(#monitorBase)" filter="url(#monitorShadow)"/>
  <rect x="470" y="555" width="60" height="32" fill="url(#monitorBase)"/>

  <!-- Haste -->
  <path d="M462 555 L538 555 L530 480 L470 480 Z" fill="url(#monitorBase)"/>

  <!-- Marca no pé -->
  <rect x="490" y="588" width="20" height="3" rx="1" fill="#fff" opacity="0.3"/>

  <!-- Monitor corpo -->
  <g filter="url(#monitorShadow)">
    <rect x="80" y="80" width="840" height="500" rx="16" fill="url(#monitorBody)"/>
    <!-- Bezel interno -->
    <rect x="92" y="92" width="816" height="476" rx="6" fill="#0d1418"/>
  </g>

  <!-- Tela -->
  <rect x="100" y="100" width="800" height="460" rx="2" fill="#F0F4F8"/>

  <!-- Brilho da tela -->
  <rect x="100" y="100" width="800" height="460" rx="2" fill="url(#screenGlow)"/>

  <!-- Webcam -->
  <circle cx="500" cy="86" r="3" fill="#0a0d10"/>
  <circle cx="500" cy="86" r="1.2" fill="#1a252f"/>

  <!-- Header do app -->
  <rect x="100" y="100" width="800" height="44" fill="url(#headerBlue)"/>
  <text x="120" y="129" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">Painel Administrativo</text>
  <!-- Botões da janela -->
  <circle cx="855" cy="122" r="6" fill="#fff" opacity="0.3"/>
  <circle cx="873" cy="122" r="6" fill="#fff" opacity="0.3"/>
  <circle cx="891" cy="122" r="6" fill="#fff" opacity="0.3"/>

  <!-- Seção 1: Recepção -->
  <text x="120" y="170" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0288D1">Recepção e Validação de Dados</text>
  <g filter="url(#cardShadow)">
    <rect x="120" y="180" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(135 198)">
      <path d="M0 0 A8 8 0 0 1 16 0 L16 16 L0 16 Z" fill="none" stroke="#00BCD4" stroke-width="2"/>
      <path d="M3 12 L0 16 L3 16" fill="#00BCD4"/>
      <path d="M13 4 L16 0 L13 0" fill="#00BCD4"/>
    </g>
    <text x="205" y="215" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Sincronização</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="300" y="180" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(310 195)">
      <path d="M2 4 L14 4 M2 8 L14 8 M2 12 L10 12" stroke="#42A5F5" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M0 2 L18 2 L18 16 L0 16 Z" fill="none" stroke="#42A5F5" stroke-width="2"/>
    </g>
    <text x="385" y="215" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Validação de AITs</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="480" y="180" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(490 192)">
      <rect x="2" y="3" width="14" height="22" rx="2" fill="none" stroke="#7E57C2" stroke-width="2"/>
      <circle cx="9" cy="22" r="0.8" fill="#7E57C2"/>
      <circle cx="9" cy="10" r="2" fill="none" stroke="#7E57C2" stroke-width="1.5"/>
    </g>
    <text x="565" y="215" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Dispositivos</text>
  </g>

  <!-- Seção 2: Frota -->
  <text x="120" y="265" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0288D1">Gestão da Frota</text>
  <g filter="url(#cardShadow)">
    <rect x="120" y="275" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(135 292)">
      <rect x="0" y="6" width="14" height="8" rx="3" fill="none" stroke="#26A69A" stroke-width="2"/>
      <circle cx="4" cy="15" r="2" fill="none" stroke="#26A69A" stroke-width="1.8"/>
      <circle cx="10" cy="15" r="2" fill="none" stroke="#26A69A" stroke-width="1.8"/>
    </g>
    <text x="205" y="310" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Frota</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="300" y="275" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(313 288)">
      <path d="M0 14 L0 4 L14 4 L14 14 Z M14 6 L20 6 L20 14 L14 14" fill="none" stroke="#78909C" stroke-width="1.8"/>
      <circle cx="3" cy="14" r="1.5" fill="none" stroke="#78909C" stroke-width="1.5"/>
      <circle cx="11" cy="14" r="1.5" fill="none" stroke="#78909C" stroke-width="1.5"/>
      <circle cx="17" cy="14" r="1.5" fill="none" stroke="#78909C" stroke-width="1.5"/>
    </g>
    <text x="385" y="310" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Diário de Bordo</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="480" y="275" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(493 292)">
      <rect x="2" y="0" width="14" height="20" rx="2" fill="none" stroke="#FFA726" stroke-width="2"/>
      <line x1="6" y1="20" x2="6" y2="22" stroke="#FFA726" stroke-width="2"/>
      <line x1="12" y1="20" x2="12" y2="22" stroke="#FFA726" stroke-width="2"/>
    </g>
    <text x="565" y="310" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Abastecimento</text>
  </g>

  <!-- Seção 3: Pátio -->
  <text x="120" y="360" font-family="Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#0288D1">Pátio, Depósito e Reboque</text>
  <g filter="url(#cardShadow)">
    <rect x="120" y="370" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(132 385)">
      <rect x="2" y="3" width="14" height="18" rx="1.5" fill="none" stroke="#FF7043" stroke-width="1.8"/>
      <path d="M5 8 L13 8 M5 12 L13 12 M5 16 L10 16" stroke="#FF7043" stroke-width="1.5"/>
      <path d="M6 0 L6 4 M12 0 L12 4" stroke="#FF7043" stroke-width="1.5"/>
    </g>
    <text x="205" y="405" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Checklist</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="300" y="370" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(315 385)">
      <path d="M0 8 L0 4 L14 4 L14 8 L20 8 L20 16 L0 16 Z" fill="none" stroke="#AB47BC" stroke-width="1.8"/>
      <circle cx="4" cy="16" r="2" fill="none" stroke="#AB47BC" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="2" fill="none" stroke="#AB47BC" stroke-width="1.5"/>
    </g>
    <text x="385" y="405" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Pátio Entrada/Saída</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="480" y="370" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(495 388)">
      <circle cx="10" cy="10" r="9" fill="none" stroke="#66BB6A" stroke-width="1.8"/>
      <text x="10" y="13" font-family="Arial" font-size="10" font-weight="700" fill="#66BB6A" text-anchor="middle">$</text>
    </g>
    <text x="565" y="405" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Cálculo Taxas</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="120" y="440" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(132 455)">
      <path d="M8 2 L14 6 L8 10 Z" fill="#1E88E5"/>
      <rect x="0" y="8" width="14" height="6" rx="1" fill="none" stroke="#1E88E5" stroke-width="1.8"/>
      <line x1="0" y1="11" x2="14" y2="11" stroke="#1E88E5" stroke-width="1.5"/>
    </g>
    <text x="205" y="475" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Liberação</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="300" y="440" width="170" height="60" rx="10" fill="#fff"/>
    <g transform="translate(315 455)">
      <path d="M8 0 L16 8 L0 8 Z" fill="none" stroke="#E53935" stroke-width="2"/>
      <line x1="6" y1="3" x2="6" y2="6" stroke="#E53935" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="10" y1="3" x2="10" y2="6" stroke="#E53935" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="385" y="475" font-family="Roboto, Arial, sans-serif" font-size="10" fill="#616161" text-anchor="middle">Gestão de Leilão</text>
  </g>

  <!-- Indicador de mais opções -->
  <g filter="url(#cardShadow)">
    <rect x="480" y="440" width="170" height="60" rx="10" fill="#f8f9fa"/>
    <text x="565" y="475" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="600" fill="#0288D1" text-anchor="middle">+ mais opções</text>
  </g>
</svg>
